<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790"
    viewBox="0 0 1600 790" role="img"
    aria-label="Non-plugin transform stage shares, remaining stages normalized to 100 percent">
    <style>
      .title { fill: #e5e7eb; font: 700 24px system-ui, sans-serif; }
      .subtitle { fill: #9ca3af; font: 15px system-ui, sans-serif; }
      .label { fill: #d1d5db; font: 600 18px system-ui, sans-serif; }
      .total { fill: #9ca3af; font: 14px ui-monospace, monospace; }
      .segment { fill: #111827; font: 700 14px ui-monospace, monospace; }
      .unavailable { fill: #d1d5db; font: 16px system-ui, sans-serif; }
      .legend { fill: #d1d5db; font: 15px system-ui, sans-serif; }
    </style>
    <rect width="100%" height="100%" rx="14" fill="#111827" />
    <text x="36" y="38" class="title">Stage share without plugin execution</text>
    <text x="36" y="64" class="subtitle">
      directly measured remaining stages, renormalized to 100%
    </text>
    <text x="360" y="114" text-anchor="end" class="label">
        Babel + JS plugin
      </text>
      <text x="360" y="138" text-anchor="end" class="total">
        12.25 ms remaining
      </text>
      <g clip-path="url(#without-plugin-0)">
<rect x="380.00" y="84" width="429.40"
        height="66" fill="#38bdf8"><title>Parse:
        37.0%, 4.535 ms</title></rect><text x="594.70" y="124"
            text-anchor="middle" class="segment">37.0%</text>




<rect x="809.40" y="84" width="730.60"
        height="66" fill="#84cc16"><title>Codegen:
        63.0%, 7.716 ms</title></rect><text x="1174.70" y="124"
            text-anchor="middle" class="segment">63.0%</text></g>
      <clipPath id="without-plugin-0"><rect x="380" y="84"
        width="1160" height="66" rx="8" /></clipPath>

      <text x="360" y="230" text-anchor="end" class="label">
        SWC + WASM plugin
      </text>
      <rect x="380" y="192" width="1160" height="66"
        rx="8" fill="#374151" />
      <text x="960" y="232"
        text-anchor="middle" class="unavailable">plugin is not separable in the public API</text>

      <text x="360" y="330" text-anchor="end" class="label">
        Yuku + JS plugin
      </text>
      <text x="360" y="354" text-anchor="end" class="total">
        3.79 ms remaining
      </text>
      <g clip-path="url(#without-plugin-2)"><rect x="380.00" y="300" width="34.47"
        height="66" fill="#facc15"><title>Source encode:
        3.0%, 0.112 ms</title></rect>
<rect x="414.47" y="300" width="255.01"
        height="66" fill="#38bdf8"><title>Parse:
        22.0%, 0.832 ms</title></rect><text x="541.97" y="340"
            text-anchor="middle" class="segment">22.0%</text>


<rect x="669.48" y="300" width="121.30"
        height="66" fill="#34d399"><title>AST decode:
        10.5%, 0.396 ms</title></rect><text x="730.13" y="340"
            text-anchor="middle" class="segment">10.5%</text>
<rect x="790.78" y="300" width="578.91"
        height="66" fill="#fb923c"><title>AST encode:
        49.9%, 1.889 ms</title></rect><text x="1080.23" y="340"
            text-anchor="middle" class="segment">49.9%</text>
<rect x="1369.68" y="300" width="170.32"
        height="66" fill="#84cc16"><title>Codegen:
        14.7%, 0.556 ms</title></rect><text x="1454.84" y="340"
            text-anchor="middle" class="segment">14.7%</text></g>
      <clipPath id="without-plugin-2"><rect x="380" y="300"
        width="1160" height="66" rx="8" /></clipPath>

      <text x="360" y="438" text-anchor="end" class="label">
        OXC + Yuku walk plugin
      </text>
      <text x="360" y="462" text-anchor="end" class="total">
        1.53 ms remaining
      </text>
      <g clip-path="url(#without-plugin-3)">

<rect x="380.00" y="408" width="947.06"
        height="66" fill="#60a5fa"><title>Parse + AST transfer:
        81.6%, 1.249 ms</title></rect><text x="853.53" y="448"
            text-anchor="middle" class="segment">81.6%</text>



<rect x="1327.06" y="408" width="212.94"
        height="66" fill="#84cc16"><title>Codegen:
        18.4%, 0.281 ms</title></rect><text x="1433.53" y="448"
            text-anchor="middle" class="segment">18.4%</text></g>
      <clipPath id="without-plugin-3"><rect x="380" y="408"
        width="1160" height="66" rx="8" /></clipPath>

      <text x="360" y="546" text-anchor="end" class="label">
        OXC raw transfer + Yuku walk
      </text>
      <text x="360" y="570" text-anchor="end" class="total">
        1.28 ms remaining
      </text>
      <g clip-path="url(#without-plugin-4)">


<rect x="380.00" y="516" width="953.94"
        height="66" fill="#2dd4bf"><title>Parse + raw AST transfer:
        82.2%, 1.056 ms</title></rect><text x="856.97" y="556"
            text-anchor="middle" class="segment">82.2%</text>


<rect x="1333.94" y="516" width="206.06"
        height="66" fill="#84cc16"><title>Codegen:
        17.8%, 0.228 ms</title></rect><text x="1436.97" y="556"
            text-anchor="middle" class="segment">17.8%</text></g>
      <clipPath id="without-plugin-4"><rect x="380" y="516"
        width="1160" height="66" rx="8" /></clipPath>
    <rect x="70" y="670" width="20" height="20" rx="4"
        fill="#facc15" />
      <text x="100" y="686" class="legend">Source encode</text>

      <rect x="450" y="670" width="20" height="20" rx="4"
        fill="#38bdf8" />
      <text x="480" y="686" class="legend">Parse</text>

      <rect x="830" y="670" width="20" height="20" rx="4"
        fill="#60a5fa" />
      <text x="860" y="686" class="legend">Parse + AST transfer</text>

      <rect x="1210" y="670" width="20" height="20" rx="4"
        fill="#2dd4bf" />
      <text x="1240" y="686" class="legend">Parse + raw AST transfer</text>

      <rect x="70" y="712" width="20" height="20" rx="4"
        fill="#34d399" />
      <text x="100" y="728" class="legend">AST decode</text>

      <rect x="450" y="712" width="20" height="20" rx="4"
        fill="#fb923c" />
      <text x="480" y="728" class="legend">AST encode</text>

      <rect x="830" y="712" width="20" height="20" rx="4"
        fill="#84cc16" />
      <text x="860" y="728" class="legend">Codegen</text>
  </svg>
