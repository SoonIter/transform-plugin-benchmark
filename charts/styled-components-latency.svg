<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="790"
    viewBox="0 0 1760 790" role="img"
    aria-label="Styled-components transform latency, lower is better">
    <style>
      .title { fill: #e5e7eb; font: 700 24px system-ui, sans-serif; }
      .label { fill: #d1d5db; font: 600 18px system-ui, sans-serif; }
      .value { fill: #f9fafb; font: 700 19px ui-monospace, monospace; }
      .note { fill: #9ca3af; font: 15px system-ui, sans-serif; }
    </style>
    <rect width="100%" height="100%" rx="14" fill="#111827" />
    <text x="36" y="42" class="title">End-to-end latency</text>
    <text x="1724" y="42" text-anchor="end" class="note">lower is better</text>
    <text x="590" y="81" text-anchor="end" class="label">
    <title>OXC parser (experimentalRawTransfer) + styled-components plugin (JS, Yuku walk) + OXC codegen (JS)</title>
    <tspan x="590" dy="0">OXC parser (experimentalRawTransfer)</tspan>
<tspan x="590" dy="23">styled-components plugin (JS, Yuku walk)</tspan>
<tspan x="590" dy="23">OXC codegen (JS)</tspan>
  </text>
      <rect x="610" y="72" width="73.46" height="58"
        rx="8" fill="#22c55e" />
      <text x="701.46" y="108" class="value">
        6.51 ms
      </text>

      <text x="590" y="181" text-anchor="end" class="label">
